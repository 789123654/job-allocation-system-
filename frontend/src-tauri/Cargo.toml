[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3" }
tauri-plugin-log = "2"
tauri-plugin-store = "2"

# DPAPI (Windows-only) encrypts auth-session.json at rest, tied to the current Windows user
# account — Phase 4 Step 3 decision, confirmed with the user: do this now (free, since nothing has
# been distributed yet) rather than defer past first distribution (would then need a legacy-format
# migration shim). macOS/Linux fall back to plaintext in store_crypto.rs until Keychain/libsecret
# equivalents are added, before either platform is ever distributed to.
[target.'cfg(windows)'.dependencies]
windows-dpapi = "0.2"
