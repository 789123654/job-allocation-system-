[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-store = "2"

# Embedded WebDriver server for the Phase 6 E2E harness (WebdriverIO + @wdio/tauri-service).
# Optional + feature-gated, NEVER a default/unconditional dependency: this plugin's own README
# states "This plugin exposes automation capabilities via HTTP. Never include it in production
# builds" — independently confirmed against owasp-tcasvs V2.1.3 ("Production builds exclude
# unnecessary features... test utilities"), since Tauri's own docs don't state this requirement
# anywhere else a reader would find it. `cargo tauri build` (the real release command) never
# passes `--features e2e-testing`, so distributed installers never link this in — only the CI E2E
# job's own build step does. See src/lib.rs's registration and tauri.e2e.conf.json for the
# matching capability-file gate (the wdio-webdriver:default permission must not exist in the
# capability set the default build resolves either).
tauri-plugin-wdio-webdriver = { version = "1", optional = true }

[features]
e2e-testing = ["dep:tauri-plugin-wdio-webdriver"]

# DPAPI (Windows-only) encrypts auth-session.json at rest, tied to the current Windows user
# account — Phase 4 Step 3 decision, confirmed with the user: do this now (free, since nothing has
# been distributed yet) rather than defer past first distribution (would then need a legacy-format
# migration shim). macOS/Linux fall back to plaintext in store_crypto.rs until Keychain/libsecret
# equivalents are added, before either platform is ever distributed to.
[target.'cfg(windows)'.dependencies]
windows-dpapi = "0.2"
