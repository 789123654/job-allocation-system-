version: 2
updates:
  # GitHub_Actions_Security_Cheat_Sheet.md — pinned commit SHAs (ci.yml) don't update themselves;
  # this is what notices a new release exists and opens the PR to bump the pin.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      # Bumped 4 -> 7 (Semgrep p/security-audit finding, first CI run of the codeql/semgrep job) —
      # same "let the community catch a bad release first" reasoning, just a longer, more
      # conservative window; matches the ruleset's own recommended minimum.
      default-days: 7
