name: CI

on:
  push:
    branches: [main]
  pull_request:

# Found 2026-09-15 during a rapid string of debugging pushes: without this, every push spawns a
# brand-new, fully independent run instead of superseding the previous one for the same branch/PR —
# 6 pushes in quick succession piled up 5+ concurrent runs (6 jobs each) competing for the account's
# limited concurrent-job slots, so later runs' jobs sat queued behind earlier, now-irrelevant ones.
# Standard GitHub Actions practice, not just today's fix.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default (DEPLOYMENT.md §10 / GitHub_Actions_Security_Cheat_Sheet.md) — no job here
# needs to write to the repo, so nothing grants more.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Real, disposable Postgres for the RLS/tenant-isolation/BYPASSRLS tests (CODING_STRUCTURE.md
    # §2) — never the live Supabase project. Migrated fresh every run, thrown away after.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # fastapi_app has no password until the migration-created role is given one below — this
      # container is thrown away at the end of the job, so a fixed value here is fine; the real
      # Supabase project's password is never anything like this (DEPLOYMENT.md §2).
      DATABASE_URL: postgresql+psycopg://fastapi_app:ci_test_password@localhost:5432/postgres
      MIGRATIONS_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
      TEST_DATABASE_URL: postgresql+psycopg://fastapi_app:ci_test_password@localhost:5432/postgres
      TEST_MIGRATIONS_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
      SUPABASE_URL: https://ci-placeholder.supabase.co
      SUPABASE_SECRET_KEY: sb_secret_ci_placeholder
      CORS_ORIGINS: '["http://localhost"]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # GitHub_Actions_Security_Cheat_Sheet.md — nothing here pushes back
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"
      - run: uv sync --frozen --dev
      - run: uv run ruff check .
      - run: uv run pyright
      # `uv run --with` layers pip-audit on top of the already-synced project venv (verified
      # against uv's own docs) rather than `uvx pip-audit`'s isolated throwaway env, which would
      # never see this project's actual locked dependency versions at all.
      - run: uv run --with pip-audit pip-audit
      - name: Stub Supabase's auth.users and auth-admin roles (CI-only — the real project already has these)
        run: |
          uv run python -c "
          import psycopg
          conn = psycopg.connect('postgresql://postgres:postgres@localhost:5432/postgres', autocommit=True)
          conn.execute('CREATE SCHEMA IF NOT EXISTS auth')
          conn.execute('''
              CREATE TABLE IF NOT EXISTS auth.users (
                  id uuid PRIMARY KEY,
                  email text,
                  raw_user_meta_data jsonb
              )
          ''')
          # a8e6def15927's GRANT/REVOKE statements target these Supabase-provisioned roles —
          # nonexistent on vanilla postgres:17, so alembic upgrade head would error without them.
          conn.execute('CREATE ROLE supabase_auth_admin')
          conn.execute('CREATE ROLE authenticated')
          conn.execute('CREATE ROLE anon')
          "
      - run: uv run alembic upgrade head
      - name: Set fastapi_app's CI-only password
        run: |
          uv run python -c "
          import psycopg
          conn = psycopg.connect('postgresql://postgres:postgres@localhost:5432/postgres', autocommit=True)
          conn.execute(\"ALTER ROLE fastapi_app WITH PASSWORD 'ci_test_password'\")
          "
      # Authorization regression suite as its own gate (Authorization_Regression_Testing_Cheat_
      # Sheet.md — "the authorization test suite must be a required check ... tag or group them
      # distinctly"). Re-runs under the full pytest below too; this step exists so an access-
      # control regression surfaces as an authz failure, not one line buried in 130 tests.
      - run: uv run pytest -m authz
      # --cov-fail-under is a ratchet: set ~1 point below the current measured number for rounding
      # slack, raised only in the PR that adds the tests earning it — never toward 100%, which just
      # breeds assertion-free tests. A PR that drops coverage below this fails here and can't merge.
      # 92 -> 93: the authz regression suite (test_authz_regression.py + test_deps.py additions)
      # took the measured number to 94.4%.
      - run: uv run pytest --cov=app --cov-report=term-missing --cov-fail-under=93
      # Mutation testing (mutmut, docs/SECURITY_AUDIT_CHECKLIST.md 2026-09-14 — a mechanized
      # supplement to this project's manual rule-10.1 negative control, not a replacement).
      # Non-blocking on purpose: mutmut has no documented CI exit-code/threshold gate (checked
      # directly against its own current docs, not assumed), and this is this project's first run
      # of it — observe real numbers before ever gating merges on them, same ratchet approach
      # already used for the coverage threshold above. Scoped to crud.py/idempotency.py (the
      # business-logic-dense modules every real bug this project has shipped has lived in), not the
      # whole app — thin routing/settings modules aren't where a surviving mutant would matter.
      # `use_git_change_detection` (pyproject.toml) keeps repeat runs fast without a persisted cache.
      # Re-added 2026-09-14 (was pulled out the same day over Actions-minutes cost) — the repo is
      # now public, so Actions minutes are unlimited/free and that cost reason no longer applies.
      - name: Mutation testing (mutmut) — advisory, does not fail the build
        continue-on-error: true
        run: |
          uv run mutmut run || true
          uv run mutmut results

  # End-to-end auth against a real local Supabase stack (GoTrue + Postgres), not the bare
  # postgres:17 + hand-stubbed auth.users the `backend` job uses. This is where the provisioning
  # trigger, the custom_access_token_hook, and real ES256-token verification against a real local
  # JWKS endpoint actually run. Separate job (own ~90s Docker boot) so the fast `backend` job
  # stays fast. NOT the live Supabase project — a disposable local stack, thrown away after.
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # All loopback (127.0.0.1) — the TLS-to-remote-DB guard (config.py) exempts loopback, and
    # `Settings()` runs at import in env.py / the app, so every field must be present from the
    # first step. SUPABASE_URL / SUPABASE_SECRET_KEY / E2E_ANON_KEY are appended to $GITHUB_ENV by
    # the `supabase status` step below.
    env:
      DATABASE_URL: postgresql+psycopg://fastapi_app:ci_test_password@127.0.0.1:54322/postgres
      MIGRATIONS_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:54322/postgres
      TEST_DATABASE_URL: postgresql+psycopg://fastapi_app:ci_test_password@127.0.0.1:54322/postgres
      TEST_MIGRATIONS_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:54322/postgres
      CORS_ORIGINS: '["http://localhost"]'
      E2E: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"
      - run: uv sync --frozen --dev
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.117.0
      - name: Start local Supabase (db + auth + api only, per supabase/config.toml)
        working-directory: .
        run: supabase start
      - name: Export stack connection details
        working-directory: .
        run: |
          # `-o env` emits KEY="value" (shell-quoted); $GITHUB_ENV takes the value literally, so
          # the quotes would end up inside SUPABASE_URL and break the JWKS URL. Go via JSON.
          status=$(supabase status -o json)
          {
            echo "SUPABASE_URL=$(echo "$status" | jq -r '.API_URL')"
            echo "SUPABASE_SECRET_KEY=$(echo "$status" | jq -r '.SERVICE_ROLE_KEY')"
            echo "E2E_ANON_KEY=$(echo "$status" | jq -r '.ANON_KEY')"
          } >> "$GITHUB_ENV"
      - name: Migrate the local stack's Postgres (Alembic, as the supabase superuser)
        run: uv run alembic upgrade head
      - name: Give fastapi_app its CI-only password
        run: |
          uv run python -c "
          import psycopg
          conn = psycopg.connect('postgresql://postgres:postgres@127.0.0.1:54322/postgres', autocommit=True)
          conn.execute(\"ALTER ROLE fastapi_app WITH PASSWORD 'ci_test_password'\")
          "
      - name: e2e tests
        run: uv run pytest -m e2e -v
      - name: Seed a real owner account for the frontend contract test
        run: |
          uv run python -c "
          import os, uuid
          import httpx
          import psycopg
          from app.core.supabase_admin import admin_auth

          firm_id = str(uuid.uuid4())
          email = f'{uuid.uuid4()}@example.com'
          password = 'contract-Test-Password-9'

          conn = psycopg.connect('postgresql://postgres:postgres@127.0.0.1:54322/postgres', autocommit=True)
          conn.execute(
              'INSERT INTO firms (id, name, plan, status) VALUES (%s, %s, %s, %s)',
              (firm_id, 'Contract', 'free', 'active'),
          )

          created = admin_auth.create_user({
              'email': email,
              'password': password,
              'email_confirm': True,
              # app_metadata, not user_metadata — matches crud.create_employee's real payload
              # shape since the trigger fix (c0f23284b2fd, code review finding #11). Missing here
              # originally: a 4th call site the initial fix's sweep missed, caught only when this
              # exact step started 500ing in CI (no profile ever got created, so the later login
              # step's JWT hook found no row and failed) — found via a repo-wide re-grep for
              # 'user_metadata.*firm_id' after the first three call sites were already fixed.
              'app_metadata': {'firm_id': firm_id, 'role': 'owner'},
              'user_metadata': {'full_name': 'Contract Owner'},
          })
          user_id = str(created.user.id)
          conn.execute('UPDATE profiles SET must_change_password = false WHERE id = %s', (user_id,))
          conn.close()

          resp = httpx.post(
              os.environ['SUPABASE_URL'] + '/auth/v1/token',
              params={'grant_type': 'password'},
              json={'email': email, 'password': password},
              headers={'apikey': os.environ['E2E_ANON_KEY'], 'Content-Type': 'application/json'},
          )
          resp.raise_for_status()
          token = resp.json()['access_token']

          # GitHub_Actions_Security_Cheat_Sheet.md: 'Mask all sensitive information that is not a
          # GitHub secret by using ::add-mask::{value}' — this is a real bearer token (scoped to a
          # throwaway per-run local stack, but explicit, not relied on any unconfirmed automatic
          # runner behavior).
          print('::add-mask::' + token)
          # Same masking for the raw password — the Phase 6 E2E login-flow spec logs in through the
          # real UI with this same seeded account (not a second insert), so it needs the actual
          # credential, not just the bearer token the contract test uses.
          print('::add-mask::' + password)

          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('CONTRACT_TEST_TOKEN=' + token + '\n')
              f.write('E2E_OWNER_EMAIL=' + email + '\n')
              f.write('E2E_OWNER_PASSWORD=' + password + '\n')
          "
      - name: Start the FastAPI backend against the local Supabase stack
        run: |
          nohup uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/uvicorn.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health > /dev/null && exit 0
            sleep 1
          done
          echo "FastAPI never became ready"; cat /tmp/uvicorn.log; exit 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend contract test (real FastAPI + real local Supabase stack, not MSW)
        working-directory: frontend
        env:
          CONTRACT_API_BASE_URL: http://127.0.0.1:8000
        run: npx vitest run --config vitest.contract.config.ts
      # Phase 6 Step 1 (docs/CODING_STRUCTURE.md §4) — WebdriverIO + @wdio/tauri-service E2E
      # harness, extending this job rather than adding a new one: it already has the real local
      # Supabase + FastAPI stack this needs, and staying on ubuntu-latest sidesteps an unverified
      # question a new windows-latest job would raise (GitHub-hosted Windows runners' Docker
      # support for the Linux containers `supabase start` needs).
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      # Exact package list per v2.tauri.app/start/prerequisites/ (fetched live this session, not
      # guessed) — webkit2gtk-driver deliberately omitted: that's only needed for the 'external'
      # driverProvider; the embedded provider (tauri-plugin-wdio-webdriver) needs no driver binary.
      - name: Install Linux Tauri build prerequisites
        # libgl1-mesa-dri: Xvfb has no real GPU, so WebKitGTK's default hardware-accelerated (EGL/
        # DRI3) rendering fails outright ("libEGL warning: DRI3 error: Could not get DRI3 device"),
        # leaving the webview's JS bridge never ready. This is Mesa's software rasterizer (llvmpipe),
        # paired with the LIBGL_ALWAYS_SOFTWARE/GALLIUM_DRIVER env vars on the E2E step below —
        # verified against a matching real-world case (identical DRI3 error), not guessed.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb libgl1-mesa-dri
      - name: Build the Tauri app with the E2E-only WebDriver feature
        working-directory: frontend
        # --features e2e-testing (Cargo.toml) links in tauri-plugin-wdio-webdriver; --config
        # merges tauri.e2e.conf.json, which supplies the matching e2e-testing capability entry on
        # top of tauri.conf.json's own ["default"]-only allowlist (build-manifest bookkeeping only
        # — Cargo.toml's own comment on this dependency is the real production-exclusion control).
        # Neither is ever passed by the real release build command. --no-bundle: WDIO only needs
        # the raw binary at target/debug/app (wdio.conf.ts); the default "targets": "all" in
        # tauri.conf.json would otherwise also build .deb/.rpm/.AppImage bundles nobody uses here,
        # costing ~13 minutes of this job's runtime for no benefit.
        #
        # Root-caused 2026-09-15 (third failure layer, after the startup crash and the WebKitGTK/
        # DRI3 rendering fix): src/config/env.ts's requireEnv() throws at module-import time if
        # VITE_SUPABASE_URL/VITE_SUPABASE_ANON_KEY/VITE_API_BASE_URL are unset — which they were,
        # since `vite build`'s default "production" mode doesn't load frontend/.env.test, and this
        # job never set them either. That crashed main.tsx before createRoot().render() ever ran,
        # leaving #root permanently empty (confirmed via wdio.conf.ts's own diagnostic: readyState
        # complete, __TAURI_INTERNALS__ present, but zero rendered content). Fixed by pointing the
        # build at the same real local Supabase + FastAPI stack the rest of this job already uses
        # (SUPABASE_URL/E2E_ANON_KEY are already real values exported earlier in this job), not the
        # placeholder project in .env.test — this build needs to actually log in for real.
        env:
          VITE_SUPABASE_URL: ${{ env.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ env.E2E_ANON_KEY }}
          VITE_API_BASE_URL: http://localhost:8000
        run: npx tauri build --debug --no-bundle --features e2e-testing --config src-tauri/tauri.e2e.conf.json
      # Root-caused 2026-09-15: the app is a WebKitGTK GUI process and needs a real X display.
      # A prior diagnostic step ran the raw binary directly under xvfb-run and it stayed up fine —
      # but this step, which lets @wdio/tauri-service spawn the app itself, had no xvfb-run wrapper
      # at all, so the app died in ~120ms (code 101) with no DISPLAY. Fixed by running the whole
      # WDIO process under xvfb-run instead (diagnostic step removed, its job is done).
      - name: E2E tests (WebdriverIO, embedded WebDriver provider)
        working-directory: frontend
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          NO_AT_BRIDGE: "1"
        run: xvfb-run -a npm run test:e2e

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # test:coverage (not plain test) so the coverage % shows in the CI log every run. No
      # threshold gate yet — the frontend is mid-scaffold (Phase 4 slice 1); add one in
      # vite.config.ts once the auth screens and their tests land.
      - run: npm run test:coverage
      - run: npm run build
      # Mutation testing (Stryker, docs/SECURITY_AUDIT_CHECKLIST.md 2026-09-14) — frontend
      # counterpart of the backend's mutmut step above; same "advisory first, gate later once real
      # numbers exist" reasoning. `incremental: true` (stryker.config.json) only re-mutates
      # changed code on top of a prior run — the cache below persists that report across CI runs so
      # every PR isn't a full run from scratch; restore-keys falls back to main's last report for a
      # fresh branch. `thresholds.break: null` already tells Stryker itself never to exit non-zero on
      # score; continue-on-error is the second layer, covering a genuine tool/runtime error too.
      # Re-added 2026-09-14 (was pulled out the same day over Actions-minutes cost) — the repo is
      # now public, so Actions minutes are unlimited/free and that cost reason no longer applies.
      #
      # Cache key bumped to v2-2026-09-15 (2026-09-15): the 2026-09-14 incremental report was
      # confirmed stale — session-store.tsx's cache-clear mutant was reported "Survived" even
      # though directly reproducing the mutation (removing queryClient.clear(), rerunning the real
      # test) showed the existing test catches it immediately. Root cause per Stryker's own docs
      # and a matching upstream report (stryker-mutator/stryker-js incremental docs;
      # ddteeter/agentic-guardrails-scaffolding#67, "stryker analyzer reuses a cached Survived
      # after the test that kills it is added"): incremental mode's cache invalidation checks
      # production-file changes, not test-file changes, so a mutant already marked Survived can
      # stay stale even after a new/stronger test is added. Changing the key (rather than passing
      # --force permanently) makes this one run measure everything fresh and then start a new,
      # correctly-invalidating cache under the new key going forward.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: frontend/reports/stryker-incremental.json
          key: stryker-incremental-v2-2026-09-15-${{ github.ref_name }}
          restore-keys: stryker-incremental-v2-2026-09-15-main
      - name: Mutation testing (Stryker) — advisory, does not fail the build
        continue-on-error: true
        run: npm run test:mutation

  security:
    runs-on: ubuntu-latest
    # GitHub_Actions_Security_Cheat_Sheet.md: gitleaks catches secrets that slipped past .gitignore
    # (decided in DEPLOYMENT.md §4, never actually wired in until now); zizmor statically scans this
    # workflow file itself, not the app code — a different surface than the backend/frontend jobs.
    permissions:
      contents: read
      # gitleaks-action calls GET /pulls/{n}/commits on pull_request events to resolve the commit
      # range to scan — 403s ("Resource not accessible by integration") without this. Confirmed by
      # the actual failing run, not assumed; granting only `read` (not `write`) per CI_CD_Security_
      # Cheat_Sheet.md's least-privilege guidance ("access must be justified, not assumed") since
      # nothing here has shown a need to write back to the PR.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks needs full history, not just the latest commit
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No GITLEAKS_LICENSE — free for personal-account repos, only orgs need one.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uvx zizmor --format=github .github/workflows/
        env:
          # Without this, zizmor stays in offline mode and skips GitHub-API-backed audits like
          # impostor-commit — confirmed by the first CI run of this job, not assumed.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # CODING_STRUCTURE.md's Phase 5 plan named Semgrep as a hardening-pass item, pulled forward.
      # No login/account needed for named registry rulesets — verified directly (`uvx semgrep scan
      # --config p/security-audit ...` runs standalone, exit 0/1 on clean/findings, confirmed by a
      # real local run before wiring this in, not assumed from `--config auto`'s own docs, which
      # do mention a login flow that a bare `--config <ruleset>` never triggers).
      # .semgrep/custom-rules.yml (added 2026-09-10) — project-specific rules the public registry
      # rulesets can't know about, e.g. banning a hand-rolled session.rollback() outside
      # core.db.commit_or_recover (SECURITY_AUDIT_CHECKLIST.md's 2026-09-09 follow-up).
      - run: >
          uvx semgrep scan --config p/security-audit --config p/owasp-top-ten
          --config .semgrep/custom-rules.yml --error .
      # CODING_STRUCTURE.md's Phase 5 plan named Trivy alongside Semgrep/CodeQL — finishing that
      # line now. Filesystem-scan mode (not image mode) covers dependency CVEs across all three
      # languages this repo actually uses in one tool (Python/uv.lock, npm/package-lock.json,
      # Rust/Cargo.lock in frontend/src-tauri) — verified support directly against Vulnerable_
      # Dependency_Management_Cheat_Sheet.md's own tool table, not assumed. `scanners: vuln` only
      # (not secret/misconfig) — gitleaks and zizmor above already cover those, no overlap wanted.
      # ignore-unfixed: true — a CVE with no available fix yet would block every future PR
      # indefinitely with nothing actionable to do about it.
      # severity: includes MEDIUM (added 2026-09-10) — every other check in this job fails on any
      # finding, so Trivy passing a fixable MEDIUM that pip-audit/Dependabot both flag was an
      # inconsistency. The one current MEDIUM (glib, transitive via Tauri, no upgrade path yet) is
      # waived with a reason + removal condition in .trivyignore, same strict-gate-plus-explicit-
      # waiver pattern as the # nosemgrep lines. trivyignores: points at that file explicitly rather
      # than relying on auto-discovery from the scan root.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"

  codeql:
    runs-on: ubuntu-latest
    # No security-events: write, and `upload: never` below — this repo is private on a personal
    # account, where GitHub Advanced Security (required to use the Security-tab dashboard on a
    # private repo at all) isn't purchasable without upgrading to a paid Team/Enterprise plan
    # (verified live against GitHub's own docs, 2026-09-07 — not assumed). A hard CI failure on any
    # finding is the enforcement here instead of the dashboard.
    #
    # actions: read IS still needed even with upload: never — codeql-action calls GitHub's
    # workflow-runs API internally for its own status/telemetry reporting regardless of the upload
    # setting. Confirmed by the first real CI run of this job, not assumed: without it, both matrix
    # jobs failed with "Resource not accessible by integration" on that exact API call and CodeQL
    # itself reported "job status was configuration error" — a permissions gap, not a code finding.
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: none # both languages here are interpreted — nothing to build
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          upload: never
          output: codeql-results
      - name: Fail if CodeQL found anything
        run: |
          count=$(jq '[.runs[].results[]] | length' codeql-results/*.sarif)
          echo "CodeQL findings (${{ matrix.language }}): $count"
          if [ "$count" -gt 0 ]; then
            jq '.runs[].results[] | {rule: .ruleId, message: .message.text, location: .locations[0].physicalLocation.artifactLocation.uri}' codeql-results/*.sarif
            exit 1
          fi
