name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default (DEPLOYMENT.md §10 / GitHub_Actions_Security_Cheat_Sheet.md) — no job here
# needs to write to the repo, so nothing grants more.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Real, disposable Postgres for the RLS/tenant-isolation/BYPASSRLS tests (CODING_STRUCTURE.md
    # §2) — never the live Supabase project. Migrated fresh every run, thrown away after.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # fastapi_app has no password until the migration-created role is given one below — this
      # container is thrown away at the end of the job, so a fixed value here is fine; the real
      # Supabase project's password is never anything like this (DEPLOYMENT.md §2).
      DATABASE_URL: postgresql+psycopg://fastapi_app:ci_test_password@localhost:5432/postgres
      MIGRATIONS_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
      TEST_DATABASE_URL: postgresql+psycopg://fastapi_app:ci_test_password@localhost:5432/postgres
      TEST_MIGRATIONS_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
      SUPABASE_URL: https://ci-placeholder.supabase.co
      SUPABASE_SECRET_KEY: sb_secret_ci_placeholder
      CORS_ORIGINS: '["http://localhost"]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # GitHub_Actions_Security_Cheat_Sheet.md — nothing here pushes back
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"
      - run: uv sync --frozen --dev
      - run: uv run ruff check .
      - run: uv run pyright
      # `uv run --with` layers pip-audit on top of the already-synced project venv (verified
      # against uv's own docs) rather than `uvx pip-audit`'s isolated throwaway env, which would
      # never see this project's actual locked dependency versions at all.
      - run: uv run --with pip-audit pip-audit
      - name: Stub Supabase's auth.users and auth-admin roles (CI-only — the real project already has these)
        run: |
          uv run python -c "
          import psycopg
          conn = psycopg.connect('postgresql://postgres:postgres@localhost:5432/postgres', autocommit=True)
          conn.execute('CREATE SCHEMA IF NOT EXISTS auth')
          conn.execute('''
              CREATE TABLE IF NOT EXISTS auth.users (
                  id uuid PRIMARY KEY,
                  email text,
                  raw_user_meta_data jsonb
              )
          ''')
          # a8e6def15927's GRANT/REVOKE statements target these Supabase-provisioned roles —
          # nonexistent on vanilla postgres:17, so alembic upgrade head would error without them.
          conn.execute('CREATE ROLE supabase_auth_admin')
          conn.execute('CREATE ROLE authenticated')
          conn.execute('CREATE ROLE anon')
          "
      - run: uv run alembic upgrade head
      - name: Set fastapi_app's CI-only password
        run: |
          uv run python -c "
          import psycopg
          conn = psycopg.connect('postgresql://postgres:postgres@localhost:5432/postgres', autocommit=True)
          conn.execute(\"ALTER ROLE fastapi_app WITH PASSWORD 'ci_test_password'\")
          "
      # Authorization regression suite as its own gate (Authorization_Regression_Testing_Cheat_
      # Sheet.md — "the authorization test suite must be a required check ... tag or group them
      # distinctly"). Re-runs under the full pytest below too; this step exists so an access-
      # control regression surfaces as an authz failure, not one line buried in 130 tests.
      - run: uv run pytest -m authz
      # --cov-fail-under is a ratchet: set ~1 point below the current measured number for rounding
      # slack, raised only in the PR that adds the tests earning it — never toward 100%, which just
      # breeds assertion-free tests. A PR that drops coverage below this fails here and can't merge.
      # 92 -> 93: the authz regression suite (test_authz_regression.py + test_deps.py additions)
      # took the measured number to 94.4%.
      - run: uv run pytest --cov=app --cov-report=term-missing --cov-fail-under=93

  # End-to-end auth against a real local Supabase stack (GoTrue + Postgres), not the bare
  # postgres:17 + hand-stubbed auth.users the `backend` job uses. This is where the provisioning
  # trigger, the custom_access_token_hook, and real ES256-token verification against a real local
  # JWKS endpoint actually run. Separate job (own ~90s Docker boot) so the fast `backend` job
  # stays fast. NOT the live Supabase project — a disposable local stack, thrown away after.
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"
      - run: uv sync --frozen --dev
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.117.0
      - name: Start local Supabase (db + auth + api only, per supabase/config.toml)
        working-directory: .
        run: supabase start
      - name: Export stack connection details
        working-directory: .
        run: |
          supabase status -o env \
            --override-name api.url=SUPABASE_URL \
            --override-name auth.service_role_key=SUPABASE_SECRET_KEY \
            --override-name auth.anon_key=E2E_ANON_KEY >> "$GITHUB_ENV"
      - name: Migrate the local stack's Postgres (Alembic, as the supabase superuser)
        env:
          MIGRATIONS_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:54322/postgres
        run: uv run alembic upgrade head
      - name: Give fastapi_app its CI-only password
        run: |
          uv run python -c "
          import psycopg
          conn = psycopg.connect('postgresql://postgres:postgres@127.0.0.1:54322/postgres', autocommit=True)
          conn.execute(\"ALTER ROLE fastapi_app WITH PASSWORD 'ci_test_password'\")
          "
      - name: e2e tests
        env:
          DATABASE_URL: postgresql+psycopg://fastapi_app:ci_test_password@127.0.0.1:54322/postgres
          MIGRATIONS_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:54322/postgres
          TEST_DATABASE_URL: postgresql+psycopg://fastapi_app:ci_test_password@127.0.0.1:54322/postgres
          TEST_MIGRATIONS_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:54322/postgres
          CORS_ORIGINS: '["http://localhost"]'
          E2E: "1"
        run: uv run pytest -m e2e -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # test:coverage (not plain test) so the coverage % shows in the CI log every run. No
      # threshold gate yet — the frontend is mid-scaffold (Phase 4 slice 1); add one in
      # vite.config.ts once the auth screens and their tests land.
      - run: npm run test:coverage
      - run: npm run build

  security:
    runs-on: ubuntu-latest
    # GitHub_Actions_Security_Cheat_Sheet.md: gitleaks catches secrets that slipped past .gitignore
    # (decided in DEPLOYMENT.md §4, never actually wired in until now); zizmor statically scans this
    # workflow file itself, not the app code — a different surface than the backend/frontend jobs.
    permissions:
      contents: read
      # gitleaks-action calls GET /pulls/{n}/commits on pull_request events to resolve the commit
      # range to scan — 403s ("Resource not accessible by integration") without this. Confirmed by
      # the actual failing run, not assumed; granting only `read` (not `write`) per CI_CD_Security_
      # Cheat_Sheet.md's least-privilege guidance ("access must be justified, not assumed") since
      # nothing here has shown a need to write back to the PR.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks needs full history, not just the latest commit
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No GITLEAKS_LICENSE — free for personal-account repos, only orgs need one.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uvx zizmor --format=github .github/workflows/
        env:
          # Without this, zizmor stays in offline mode and skips GitHub-API-backed audits like
          # impostor-commit — confirmed by the first CI run of this job, not assumed.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # CODING_STRUCTURE.md's Phase 5 plan named Semgrep as a hardening-pass item, pulled forward.
      # No login/account needed for named registry rulesets — verified directly (`uvx semgrep scan
      # --config p/security-audit ...` runs standalone, exit 0/1 on clean/findings, confirmed by a
      # real local run before wiring this in, not assumed from `--config auto`'s own docs, which
      # do mention a login flow that a bare `--config <ruleset>` never triggers).
      # .semgrep/custom-rules.yml (added 2026-09-10) — project-specific rules the public registry
      # rulesets can't know about, e.g. banning a hand-rolled session.rollback() outside
      # core.db.commit_or_recover (SECURITY_AUDIT_CHECKLIST.md's 2026-09-09 follow-up).
      - run: >
          uvx semgrep scan --config p/security-audit --config p/owasp-top-ten
          --config .semgrep/custom-rules.yml --error .
      # CODING_STRUCTURE.md's Phase 5 plan named Trivy alongside Semgrep/CodeQL — finishing that
      # line now. Filesystem-scan mode (not image mode) covers dependency CVEs across all three
      # languages this repo actually uses in one tool (Python/uv.lock, npm/package-lock.json,
      # Rust/Cargo.lock in frontend/src-tauri) — verified support directly against Vulnerable_
      # Dependency_Management_Cheat_Sheet.md's own tool table, not assumed. `scanners: vuln` only
      # (not secret/misconfig) — gitleaks and zizmor above already cover those, no overlap wanted.
      # ignore-unfixed: true — a CVE with no available fix yet would block every future PR
      # indefinitely with nothing actionable to do about it.
      # severity: includes MEDIUM (added 2026-09-10) — every other check in this job fails on any
      # finding, so Trivy passing a fixable MEDIUM that pip-audit/Dependabot both flag was an
      # inconsistency. The one current MEDIUM (glib, transitive via Tauri, no upgrade path yet) is
      # waived with a reason + removal condition in .trivyignore, same strict-gate-plus-explicit-
      # waiver pattern as the # nosemgrep lines. trivyignores: points at that file explicitly rather
      # than relying on auto-discovery from the scan root.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"

  codeql:
    runs-on: ubuntu-latest
    # No security-events: write, and `upload: never` below — this repo is private on a personal
    # account, where GitHub Advanced Security (required to use the Security-tab dashboard on a
    # private repo at all) isn't purchasable without upgrading to a paid Team/Enterprise plan
    # (verified live against GitHub's own docs, 2026-09-07 — not assumed). A hard CI failure on any
    # finding is the enforcement here instead of the dashboard.
    #
    # actions: read IS still needed even with upload: never — codeql-action calls GitHub's
    # workflow-runs API internally for its own status/telemetry reporting regardless of the upload
    # setting. Confirmed by the first real CI run of this job, not assumed: without it, both matrix
    # jobs failed with "Resource not accessible by integration" on that exact API call and CodeQL
    # itself reported "job status was configuration error" — a permissions gap, not a code finding.
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: none # both languages here are interpreted — nothing to build
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          upload: never
          output: codeql-results
      - name: Fail if CodeQL found anything
        run: |
          count=$(jq '[.runs[].results[]] | length' codeql-results/*.sarif)
          echo "CodeQL findings (${{ matrix.language }}): $count"
          if [ "$count" -gt 0 ]; then
            jq '.runs[].results[] | {rule: .ruleId, message: .message.text, location: .locations[0].physicalLocation.artifactLocation.uri}' codeql-results/*.sarif
            exit 1
          fi
