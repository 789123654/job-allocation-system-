[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "fastapi[standard]>=0.141.1",
    "psycopg[binary]>=3.3.5",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.13.0",
    "sentry-sdk[fastapi]>=2.30.0",
    "sqlmodel>=0.0.42",
    "supabase-auth>=2.31.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "FAST"]

[tool.ruff.lint.per-file-ignores]
# S101: assert is the ponytail self-check pattern here, not production logic that dies under
# `python -O`. S105/S106: fixture strings like "temp-pw-123" (as a default or a kwarg) are fake
# test data, not real secrets.
"tests/**" = ["S101", "S105", "S106"]

[tool.pyright]
include = ["app", "tests"]
typeCheckingMode = "strict"

# httpx's TestClient doesn't ship complete type stubs (every .get/.post/.json call resolves to
# Unknown) — real noise from an untyped third party, not our code being wrong. app/ never trips
# these rules (verified 2026-09-04), so scoping the relief to tests/ keeps strict mode's teeth
# everywhere it can actually catch something.
[[tool.pyright.executionEnvironments]]
root = "tests"
extraPaths = ["."] # defining executionEnvironments drops the implicit root path — put it back
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownLambdaType = false

[tool.pytest.ini_options]
pythonpath = ["."]
