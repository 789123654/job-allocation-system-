[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "fastapi[standard]>=0.141.1",
    "psycopg[binary]>=3.3.5",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.13.0",
    "sentry-sdk[fastapi]>=2.30.0",
    "sqlmodel>=0.0.42",
    "supabase-auth>=2.31.0",
]

[dependency-groups]
dev = [
    "mutmut>=3.8.0",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-cov>=6.0.0",
    "ruff>=0.16.5",
    "schemathesis>=4.26.0",
]

[tool.mutmut]
# app/api/routes and app/core/config are thin/declarative (routing, settings) — crud.py and the
# workflow-state-transition logic it holds is where a surviving mutant would actually matter.
source_paths = ["app/crud.py", "app/core/idempotency.py"]
# also_copy: source_paths controls both what's mutated AND what mutmut's copy_src_dir() copies
# into its mutants/ sandbox (confirmed by reading mutmut's own file_utils.py/__main__.py source,
# 2026-09-14, after CI's own run 2 crashed here) — so without this, only crud.py/idempotency.py
# existed inside mutants/app/, and any test importing another app module (e.g. crud.py's own
# `from app.core.db import commit_or_recover`) failed with ModuleNotFoundError. also_copy runs
# before mutation (__main__.py's _run: copy_src_dir -> copy_also_copy_files -> create_mutants), so
# copying the whole app/ package here can't overwrite/undo the mutated files created afterward.
also_copy = ["app"]
# Must be a list, not a single string — mutmut's harness.py does `["--rootdir=.", "--tb=native"]
# + params + self._pytest_add_cli_args` internally, and list + str raises TypeError (caught live in
# CI, 2026-09-14: the "advisory" mutmut step was silently crashing on every mutant before this fix,
# masked by the step's own continue-on-error/`|| true` — a broken check that always no-ops is not
# actually advisory, it's just noise, so this was fixed rather than left).
#
# -k deselects tests/core/test_db.py::test_every_rollback_site_is_accounted_for — a structural
# tripwire that text-scans app/*.py counting literal `session.rollback()` occurrences (confirmed
# live in CI, 2026-09-14: it failed against the mutants/ sandbox). Not a real bug: mutmut's
# mutation technique duplicates each function into many `__mutmut_N` variants in the same file, so
# a function containing that literal string (crud.py's create_job_type) is textually multiplied —
# this test's whole job is catching drift in the real source tree, and has nothing meaningful to
# say about a synthetic mutated copy of it.
pytest_add_cli_args = [
    "-x",
    "-q",
    "-m", "not e2e and not authz",
    "-k", "not test_every_rollback_site_is_accounted_for",
]
use_git_change_detection = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E/F/I/UP/B/S/FAST from the start. Added 2026-09-10: SIM (simplify), PERF (perf anti-patterns),
# RUF (ruff's own), PTH (pathlib over os.path), C901 (complexity ceiling), and three guardrails
# that currently flag nothing but lock in the practice — ASYNC (async footguns; this is FastAPI),
# DTZ (timezone-aware datetimes; the whole domain is deadlines), LOG (logging misuse), T20 (no
# stray print() in app code).
select = ["E", "F", "I", "UP", "B", "S", "FAST", "SIM", "PERF", "ASYNC", "C901", "RUF", "PTH", "DTZ", "LOG", "T20"]

[tool.ruff.lint.mccabe]
max-complexity = 10 # C901 threshold — the default, stated so a bump is a deliberate edit

[tool.ruff.lint.per-file-ignores]
# S101: assert is the ponytail self-check pattern here, not production logic that dies under
# `python -O`. S105/S106: fixture strings like "temp-pw-123" (as a default or a kwarg) are fake
# test data, not real secrets.
"tests/**" = ["S101", "S105", "S106"]
# S311: seed.py's random.random()/random.choice() pick a synthetic task's status/deadline spread
# for load-test data variety — never a security or cryptographic use (token signing goes through
# PyJWT's own RS256, not this module). T201: these are throwaway CLI scripts — print IS the output.
# C901/PTH123: _seed's branch count and one csv open() aren't worth reworking in a load-test helper.
"loadtest/**" = ["S311", "T201", "C901", "PTH123"]

[tool.pyright]
include = ["app", "tests"]
typeCheckingMode = "strict"

# httpx's TestClient doesn't ship complete type stubs (every .get/.post/.json call resolves to
# Unknown) — real noise from an untyped third party, not our code being wrong. app/ never trips
# these rules (verified 2026-09-04), so scoping the relief to tests/ keeps strict mode's teeth
# everywhere it can actually catch something.
[[tool.pyright.executionEnvironments]]
root = "tests"
extraPaths = ["."] # defining executionEnvironments drops the implicit root path — put it back
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownLambdaType = false

[tool.pytest.ini_options]
pythonpath = ["."]
# Authorization_Regression_Testing_Cheat_Sheet.md: "Tag or group authorization tests distinctly
# (e.g. @pytest.mark.authz)" so they can be run as their own fast, legible CI gate — `uv run
# pytest -m authz` in ci.yml. Covers tenant isolation (test_rls_isolation), object-level authz
# (test_access_denials, test_authz_regression), and the auth dependency chain (test_deps).
markers = [
    "authz: authorization / access-control regression tests",
    "e2e: end-to-end tests needing a real local Supabase stack (E2E=1; the `e2e` CI job)",
]

[tool.coverage.run]
source = ["app"]
branch = true
# Migrations run under `alembic upgrade head` in CI, not under pytest — counting them
# would inflate the number with lines no test actually asserts on.
omit = ["app/alembic/*"]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(typing\\.)?overload",
]
