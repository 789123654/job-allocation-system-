[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "fastapi[standard]>=0.141.1",
    "psycopg[binary]>=3.3.5",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.13.0",
    "sentry-sdk[fastapi]>=2.30.0",
    "sqlmodel>=0.0.42",
    "supabase-auth>=2.31.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-cov>=6.0.0",
    "ruff>=0.16.5",
    "schemathesis>=4.26.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E/F/I/UP/B/S/FAST from the start. Added 2026-09-10: SIM (simplify), PERF (perf anti-patterns),
# RUF (ruff's own), PTH (pathlib over os.path), C901 (complexity ceiling), and three guardrails
# that currently flag nothing but lock in the practice — ASYNC (async footguns; this is FastAPI),
# DTZ (timezone-aware datetimes; the whole domain is deadlines), LOG (logging misuse), T20 (no
# stray print() in app code).
select = ["E", "F", "I", "UP", "B", "S", "FAST", "SIM", "PERF", "ASYNC", "C901", "RUF", "PTH", "DTZ", "LOG", "T20"]

[tool.ruff.lint.mccabe]
max-complexity = 10 # C901 threshold — the default, stated so a bump is a deliberate edit

[tool.ruff.lint.per-file-ignores]
# S101: assert is the ponytail self-check pattern here, not production logic that dies under
# `python -O`. S105/S106: fixture strings like "temp-pw-123" (as a default or a kwarg) are fake
# test data, not real secrets.
"tests/**" = ["S101", "S105", "S106"]
# S311: seed.py's random.random()/random.choice() pick a synthetic task's status/deadline spread
# for load-test data variety — never a security or cryptographic use (token signing goes through
# PyJWT's own RS256, not this module). T201: these are throwaway CLI scripts — print IS the output.
# C901/PTH123: _seed's branch count and one csv open() aren't worth reworking in a load-test helper.
"loadtest/**" = ["S311", "T201", "C901", "PTH123"]

[tool.pyright]
include = ["app", "tests"]
typeCheckingMode = "strict"

# httpx's TestClient doesn't ship complete type stubs (every .get/.post/.json call resolves to
# Unknown) — real noise from an untyped third party, not our code being wrong. app/ never trips
# these rules (verified 2026-09-04), so scoping the relief to tests/ keeps strict mode's teeth
# everywhere it can actually catch something.
[[tool.pyright.executionEnvironments]]
root = "tests"
extraPaths = ["."] # defining executionEnvironments drops the implicit root path — put it back
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownLambdaType = false

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]
branch = true
# Migrations run under `alembic upgrade head` in CI, not under pytest — counting them
# would inflate the number with lines no test actually asserts on.
omit = ["app/alembic/*"]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(typing\\.)?overload",
]
